[package]
name = "tworky-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
minijinja = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
socket2 = "0.6.5"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
socket2 = "0.6.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2.6.0"
futures-lite = "2.6.1"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
