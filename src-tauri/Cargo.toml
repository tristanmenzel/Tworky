[package]
name = "tworky"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
portable-pty = "0.9.0"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tworky-browser = { version = "0.1.0", path = "../crates/browser" }
tworky-core = { version = "0.1.0", path = "../crates/core" }
url = "2.5.8"
tokio = { version = "1", features = ["net", "sync", "time"] }
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-window-state = "2.5.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }

[dev-dependencies]
tempfile = "3.27.0"
