<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tworky diagnostics test page</title>
  </head>
  <body>
    <h1>Tworky diagnostics test page</h1>
    <p>
      Serve this folder on the worker's port (for example <code>npx serve -l &lt;port&gt;</code>),
      open it in an account's tab, then check <code>read_console</code>,
      <code>read_network</code> and <code>list_storage</code>.
    </p>
    <ul id="results"></ul>
    <script>
      // EDIT THIS to the password stored for the account you open this page as.
      const ACCOUNT_PASSWORD = "change-me-to-the-stored-password";

      // A port where nothing listens, and that browsers do not block as unsafe.
      const DEAD_URL = "http://127.0.0.1:49151/unreachable";

      const results = document.getElementById("results");
      const report = (text) => {
        const item = document.createElement("li");
        item.textContent = text;
        results.append(item);
      };

      console.error("diagnostics test: something went wrong");
      report("logged an error");

      console.error(ACCOUNT_PASSWORD);
      report("logged the account's password bare");

      localStorage.setItem("diagnostics-test-key", "diagnostics-test-value");
      report("set localStorage key diagnostics-test-key");

      fetch("/missing?code=abc")
        .then((response) => report(`/missing answered ${response.status}`))
        .catch((error) => report(`/missing failed: ${error}`));

      fetch(DEAD_URL)
        .then((response) => report(`${DEAD_URL} answered ${response.status}`))
        .catch((error) => report(`${DEAD_URL} failed: ${error}`));
    </script>
  </body>
</html>
