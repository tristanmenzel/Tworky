name: Release

# Every push to main publishes a release, v<major>.<minor>.<run number>, that
# scripts/install.{sh,ps1} and the app's Update button install. Major and minor come from Cargo.toml;
# the build stamps the full version into the app. The builds run with a read-only token and hand
# their bundles to the publish job, which uploads all three and only then publishes the release,
# so every published release has every
# platform's build. The builds are unsigned: the scripts download them with curl or
# Invoke-WebRequest, which set neither the Mark-of-the-Web nor com.apple.quarantine, so SmartScreen
# and Gatekeeper never check them.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  KEEP_RELEASES: 10

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        run: |
          version="$(node scripts/set-version.mjs).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(bash scripts/release-notes.sh "$GITHUB_SHA" "${{ steps.tag.outputs.tag }}")
          grep -q '^commit: ' <<<"$notes" || { echo "release notes have no commit: line" >&2; exit 1; }
          gh release delete "${{ steps.tag.outputs.tag }}" --cleanup-tag --yes 2>/dev/null || true
          gh release create "${{ steps.tag.outputs.tag }}" --draft --target "$GITHUB_SHA" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "$notes"

  build:
    needs: create
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            asset: target/release/bundle/nsis/*_x64-setup.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app
            asset: Tworky-universal.app.tar.gz
          - os: ubuntu-22.04
            args: --bundles appimage
            asset: target/release/bundle/appimage/*_amd64.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # linuxdeploy is itself an AppImage, and the runner has no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: node scripts/set-version.mjs "${{ needs.create.outputs.version }}"

      - run: npm run tauri build -- ${{ matrix.args }}

      - name: Archive the app (macOS)
        if: runner.os == 'macOS'
        run: tar -C target/universal-apple-darwin/release/bundle/macos -czf Tworky-universal.app.tar.gz Tworky.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ runner.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [create, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundle-*
          path: assets
          merge-multiple: true

      - name: Upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create.outputs.tag }}" assets/*
          gh release edit "${{ needs.create.outputs.tag }}" --draft=false --latest

  prune:
    needs: [create, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Prune old releases and abandoned drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,isDraft,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[] | [.tagName, .isDraft] | @tsv' |
          {
            kept=0
            while IFS="$(printf '\t')" read -r tag draft; do
              case "$tag" in v*|build-*) ;; *) continue ;; esac
              if [ "$draft" = true ]; then
                gh release delete "$tag" --cleanup-tag --yes </dev/null || true
              elif [ "$kept" -lt "$KEEP_RELEASES" ]; then
                kept=$((kept + 1))
              else
                gh release delete "$tag" --cleanup-tag --yes </dev/null || true
              fi
            done
          }
